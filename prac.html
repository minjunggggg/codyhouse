<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="prac.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <p class="cd-margin-bottom-xs cd-text-sm">Move the mouse over the box ↓</p>

    <div class="cursor-fx-target js-cursor-fx-target">
        <div class="cursor-fx-wrapper">
            <div class="cursor-fx-object cursor-fx-object--1 js-cursor-fx-object--1"></div>

            <div class="cursor-fx-object cursor-fx-object--2 js-cursor-fx-object--2"></div>
        </div>
    </div>


    <section class="cd-text-center cd-margin-bottom-xl">
        <p class="demo-morph-bg-paragraph cd-margin-bottom-sm">Hover effect ↓</p>

        <div class="cd-position-relative js-morph-bg-wrapper">
            <ul class="demo-morph-bg-list cd-position-relative cd-z-index-2" data-morph-bg-preserve>
                <li class="cd-position-relative" data-morph-bg="morph-bg-1" data-morph-bg-active>
                    <a class="demo-morph-bg-link" href="#0">Resources</a>

                    <span class="demo-morph-bg-target" data-morph-bg-target style="height: 2px;"
                        aria-hidden="true"></span>
                </li>

                <li class="cd-position-relative" data-morph-bg="morph-bg-1">
                    <a class="demo-morph-bg-link" href="#0">What is CodyFrame</a>

                    <span class="demo-morph-bg-target" data-morph-bg-target style="height: 2px;"
                        aria-hidden="true"></span>
                </li>

                <li class="cd-position-relative" data-morph-bg="morph-bg-1">
                    <a class="demo-morph-bg-link" href="#0">Contact us</a>

                    <span class="demo-morph-bg-target" data-morph-bg-target style="height: 2px;"
                        aria-hidden="true"></span>
                </li>
            </ul>

            <span class="morph-bg cd-z-index-1 demo-morph-bg-1 js-morph-bg" id="morph-bg-1" data-morph-bg-event="hover"
                aria-hidden="true"></span>
        </div>
    </section>

    <section class="cd-text-center">
        <p class="demo-morph-bg-paragraph cd-margin-bottom-sm">Click effect ↓</p>

        <div class="cd-position-relative js-morph-bg-wrapper">
            <ul class="demo-morph-bg-list">
                <li class="cd-z-index-2">
                    <button class="demo-morph-bg-button" data-morph-bg="morph-bg-2"
                        data-morph-bg-active>Resources</button>
                </li>

                <li class="cd-z-index-2">
                    <button class="demo-morph-bg-button" data-morph-bg="morph-bg-2">What is CodyFrame</button>
                </li>

                <li class="cd-z-index-2">
                    <button class="demo-morph-bg-button" data-morph-bg="morph-bg-2">Contact us</button>
                </li>
            </ul>

            <span class="morph-bg cd-z-index-1 demo-morph-bg-2 js-morph-bg" id="morph-bg-2" aria-hidden="true"></span>
        </div>
    </section>

    <div class="split-btn-v2 js-split-btn-v2">
        <button class="split-btn-v2__btn gap-2xs js-split-btn-v2__btn" aria-controls="split-btn-v2-list"
            aria-expanded="false" aria-haspopup="true">
            <span>Download</span>
            <svg class="split-btn-v2__btn-icon icon icon--2xs" viewBox="0 0 12 12">
                <title>Show download options</title>
                <g fill="currentColor">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2" d="M11 4l-5 5-5-5"></path>
                </g>
            </svg>
        </button>
        <div class="split-btn-v2__list-wrapper js-split-btn-v2__list-wrapper" id="split-btn-v2-list">
            <div class="split-btn-v2__list">
                <button class="split-btn-v2__list-item js-split-btn-v2__item" tabindex="0">
                    <svg class="icon icon--xs" viewBox="0 0 16 16" aria-hidden="true">
                        <g class="split-btn-v2__anim-path">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2" d="M8 2v5"></path>
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 7l3 3 3-3H5z" fill="currentColor"></path>
                        </g>
                        <path d="M14 10v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-3" fill="none" opacity=".4"
                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        </path>
                    </svg>
                    <span>Mac Intel (Universal)</span>
                </button>
                <button class="split-btn-v2__list-item js-split-btn-v2__item" tabindex="0">
                    <svg class="icon icon--xs" viewBox="0 0 16 16" aria-hidden="true">
                        <g class="split-btn-v2__anim-path">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2" d="M8 2v5"></path>
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 7l3 3 3-3H5z" fill="currentColor"></path>
                        </g>
                        <path d="M14 10v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-3" fill="none" opacity=".4"
                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        </path>
                    </svg>
                    <span>Apple Silicon</span>
                </button>
            </div>
        </div>
        <span class="split-btn-v2__morph-bg js-split-btn-v2__morph-bg" aria-hidden="true" style=""></span>
    </div>
</body>

<script src="prac.js"></script>

</html>
